<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAU WIFI HELPER</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-theme="dark">

<div class="app">
  <!-- ================= 标题栏 ================= -->
  <header class="titlebar">
    <div class="brand">
      <span class="brand-mark">C</span>
      <span class="brand-name">CAU WIFI HELPER</span>
    </div>
    <div class="titlebar-right">
      <button class="status-pill" id="status-pill" title="主用端口状态">
        <span class="dot"></span>未连接
      </button>
      <button class="icon-btn" id="btn-settings" title="设置" aria-label="设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>
      </button>
      <div class="win-btns">
        <button class="win-btn" title="最小化（桌面端可用）" aria-label="最小化">
          <svg viewBox="0 0 12 12" stroke="currentColor" stroke-width="1.2"><path d="M2 6h8"/></svg>
        </button>
        <button class="win-btn" title="最大化（桌面端可用）" aria-label="最大化">
          <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="2.5" y="2.5" width="7" height="7"/></svg>
        </button>
        <button class="win-btn" title="关闭（桌面端可用）" aria-label="关闭">
          <svg viewBox="0 0 12 12" stroke="currentColor" stroke-width="1.2"><path d="M3 3l6 6M9 3l-6 6"/></svg>
        </button>
      </div>
    </div>
  </header>

  <div class="workspace">
    <!-- ================= 端口侧栏 ================= -->
    <aside class="sidebar" id="sidebar">
      <div class="side-head">
        <span class="side-title">端口</span>
        <button class="link-btn" id="btn-rescan">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
          重新扫描
        </button>
      </div>

      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
        <input id="search" placeholder="搜索端口或 IP" autocomplete="off" spellcheck="false">
        <button class="search-clear" title="清除搜索" aria-label="清除搜索">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" width="12" height="12"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>

      <div class="batch" id="batch">
        <span class="batch-count">已选 0 项</span>
        <button class="batch-btn" id="batch-tag">打标签</button>
        <button class="batch-btn danger" id="batch-remove">移除</button>
      </div>

      <div class="port-list" id="port-list"></div>

      <div class="side-foot" id="side-foot"></div>
    </aside>

    <!-- ================= 主界面 ================= -->
    <main class="main" id="view-main">
      <section class="stats" id="stats"></section>

      <section class="auth">
        <div class="auth-title">校园网<br>账号</div>
        <label class="field">
          <input id="username" placeholder="账号" autocomplete="username" spellcheck="false">
        </label>
        <label class="field pw">
          <input id="password" type="password" placeholder="密码" autocomplete="current-password">
          <button class="pw-toggle" id="pw-toggle" title="显示密码" aria-label="显示密码" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/></svg>
          </button>
        </label>
        <label class="chk"><input type="checkbox" id="remember"><span>记住密码</span></label>
        <button class="btn primary" id="btn-login">登录</button>
        <button class="btn danger-ghost" id="btn-clear" disabled>清除凭据</button>
        <div class="auth-note">凭据仅保存在本机<br>下次启动自动重连</div>
      </section>

      <section class="tblcard" id="tbl-card">
        <div class="card-head">
          <div class="card-title">端口状态</div>
          <div class="card-meta">每秒刷新 · Ctrl 多选 · 按下载速度排序</div>
          <div class="card-actions">
            <button class="mini-btn" id="btn-tag-filter">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></svg>
              筛选标签
            </button>
            <button class="mini-btn" disabled title="第一版暂不支持导出">导出</button>
          </div>
        </div>

        <div class="tbl-wrap" id="tbl-wrap">
          <table class="tbl">
            <colgroup>
              <col style="width:27%">
              <col style="width:13%">
              <col style="width:15%">
              <col style="width:12%">
              <col class="col-tags" style="width:23%">
              <col style="width:10%">
            </colgroup>
            <thead>
              <tr>
                <th>端口</th>
                <th>状态</th>
                <th class="sortable" data-sort="rate">下载速度<span class="sort-arrow"></span></th>
                <th class="sortable" data-sort="rtt">延迟<span class="sort-arrow"></span></th>
                <th class="col-tags">标签</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="port-rows"></tbody>
          </table>
          <div id="table-empty" hidden></div>
        </div>

        <div class="chart">
          <div class="chart-head">
            <span class="chart-title">近 60 秒下行速率</span>
            <span class="chart-note" id="chart-note"></span>
            <span class="chart-now" id="chart-now">—</span>
          </div>
          <div class="chart-canvas" id="chart-box">
            <div id="chart-svg"></div>
            <div class="chart-tip" id="chart-tip"></div>
          </div>
        </div>
      </section>
    </main>

    <!-- ================= 标签管理 ================= -->
    <div class="page" id="view-tags" hidden>
      <div class="page-head">
        <button class="back-btn" id="back-tags" aria-label="返回主界面">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <div class="page-title">标签管理</div>
        <div style="margin-left:auto">
          <button class="btn ghost" id="btn-new-tag">＋ 新建标签</button>
        </div>
      </div>
      <div class="page-sub">标签会显示在端口上，可按标签筛选。最多 8 个字，颜色 8 选 1。</div>
      <div id="tags-body"></div>
    </div>

    <!-- ================= 设置 ================= -->
    <div class="page" id="view-settings" hidden>
      <div class="page-head">
        <button class="back-btn" id="back-settings" aria-label="返回主界面">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <div class="page-title">设置</div>
      </div>
      <div class="page-sub">改动即时生效，保存在本机。桌面端专属项在原型中不可用。</div>
      <div id="settings-body"></div>
    </div>
  </div>
</div>

<div class="modal-layer" id="modal-layer" hidden></div>
<div class="toasts" id="toasts"></div>
<div id="ctx-root"></div>

<script src="mock.js"></script>
<script src="app.js"></script>
</body>
</html>
